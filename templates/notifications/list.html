{% extends "base.html" %}
{% block title %}Notifications — OpsDesk{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-4">
  <h1 class="h3 mb-0">Notifications</h1>
  <a href="{% url 'notifications:mark_all_read' %}" class="btn btn-outline-secondary btn-sm">Mark all read</a>
</div>
<ul class="list-group">
  {% for n in notifications %}
  <li class="list-group-item {% if not n.is_read %}list-group-item-primary{% endif %}">
    <a href="{% url 'notifications:read' n.pk %}" class="text-decoration-none text-dark">
      <strong>{{ n.title }}</strong>
      <p class="mb-0 small text-muted">{{ n.message|truncatewords:20 }}</p>
    </a>
  </li>
  {% empty %}
  <li class="list-group-item text-muted">No notifications</li>
  {% endfor %}
</ul>
{% endblock %}
