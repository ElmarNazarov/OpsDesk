{% extends "base.html" %}
{% block title %}Assets — OpsDesk{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-4">
  <h1 class="h3 mb-0">Assets</h1>
  <a href="{% url 'ops:asset_create' %}" class="btn btn-primary">New Asset</a>
</div>
<table class="table table-hover">
  <thead><tr><th>Name</th><th>Serial</th><th>Category</th><th>Status</th><th></th></tr></thead>
  <tbody>
    {% for a in assets %}
    <tr>
      <td>{{ a.name }}</td><td>{{ a.serial_number }}</td><td>{{ a.category.name }}</td>
      <td>{{ a.get_status_display }}</td>
      <td><a href="{% url 'ops:asset_detail' a.pk %}">View</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
