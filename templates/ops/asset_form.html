{% extends "base.html" %}
{% block title %}{{ title }} — OpsDesk{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{{ title }}</h1>
<form method="post" class="col-md-8">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}<button class="btn btn-primary">Save</button></form>
{% endblock %}
