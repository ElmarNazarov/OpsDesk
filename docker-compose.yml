services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opsdesk
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["sed -i 's/\\r$$//' docker/entrypoint.sh 2>/dev/null; exec sh docker/entrypoint.sh python manage.py runserver 0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["sed -i 's/\\r$$//' docker/entrypoint.sh 2>/dev/null; exec sh docker/entrypoint.sh celery -A config worker -l info"]
    volumes:
      - .:/app
    env_file:
      - .env.example
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["sed -i 's/\\r$$//' docker/entrypoint.sh 2>/dev/null; exec sh docker/entrypoint.sh celery -A config beat -l info"]
    volumes:
      - .:/app
    env_file:
      - .env.example
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
